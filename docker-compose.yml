services:
  postgres:
    image: postgres:16-alpine
    container_name: chat_analyzer_db
    environment:
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: bot_password
      POSTGRES_DB: chat_analyzer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_user -d chat_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: chat_analyzer_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_DSN: postgres://bot_user:bot_password@postgres:5432/chat_analyzer

volumes:
  pgdata: